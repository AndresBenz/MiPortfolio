<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="Css/estilos.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <header  class="w-full pt-6 px-4 flex justify-center absolute top-0 left-0 z-50">
        <div class="w-full max-w-5xl bg-[#1B2A22]/80 backdrop-blur-md border border-white/[0.08] rounded-full px-6 py-3 flex items-center justify-between shadow-lg">
            
            <a href="index.html" class="flex items-center gap-3">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#34D399] opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#34D399]"></span>
                </span>
                <span  class="text-[#E5ECE8] font-semibold text-base tracking-wide hover:opacity-90 transition">
                    Portfolio</span>
            </a>
            <nav class="hidden md:flex items-center gap-6">
                <ul class="flex items-center gap-6 text-sm font-medium text-[#8C9E95]">
                    <li><a href="#sobreMi" class="hover:text-[#E5ECE8] transition">Sobre mi</a></li>
                    <li><a href="#Skills" class="hover:text-[#E5ECE8] transition">Skills</a></li>
                    <li><a href="#Proyectos" class="hover:text-[#E5ECE8] transition">Proyectos</a></li>
                    <li><a href="#contacto" class="text-slate-300 hover:text-cyan-400 transition">Contacto</a></li>
                    <li><a href="#Redes" class="text-slate-300 hover:text-cyan-400 transition">Redes</a></li>
                </ul>
            </nav>
        </div>
      
        
    </header>

    <main>
        <section class="hero">
             <div id="particles-js"></div>
            <div class="hero-texto">
                <span class="subtitulo">Desarrollador de Software</span>
                <h1 id="hero-nombre"></h1>
                <p id="hero-saludo"></p>
                <div class="hero-botones">
                    <a href="#contacto" class="btn btn-primario">Contactar</a>
                    <a href="#proyectos" class="btn btn-secundario">Ver Proyectos</a>
                </div>
            </div>
            <div class="hero-foto">
                <svg class="foto__blob" viewBox="0 0 479 467" xmlns="http://www.w3.org/2000/svg">
                    <mask id="maskFoto" mask-type="alpha">
                        <path d="M9.19024 145.964C34.0253 76.5814 114.865 54.7299 184.111 29.4823C245.804 6.98884 311.86 -14.9503 370.735 14.143C431.207 44.026 467.948 107.508 477.191 174.311C485.897 237.229 454.931 294.377 416.506 344.954C373.74 401.245 326.068 462.801 255.442 466.189C179.416 469.835 111.552 422.137 65.1576 361.805C17.4835 299.81 -17.1617 219.583 9.19024 145.964Z"/>
                    </mask>
                    <g mask="url(#maskFoto)">
                        <path d="M9.19024 145.964C34.0253 76.5814 114.865 54.7299 184.111 29.4823C245.804 6.98884 311.86 -14.9503 370.735 14.143C431.207 44.026 467.948 107.508 477.191 174.311C485.897 237.229 454.931 294.377 416.506 344.954C373.74 401.245 326.068 462.801 255.442 466.189C179.416 469.835 111.552 422.137 65.1576 361.805C17.4835 299.81 -17.1617 219.583 9.19024 145.964Z"/>
                        <image class="foto__blob-img" x="0" y="-110" href="Imagenes/foto.jpg" width="480" height="800"/>
                    </g>
                </svg>
            </div>
        </section>

        <section id="sobreMi" class="seccion sobre-mi">
            <h2>Sobre mí</h2>
            <p id="sobre-mi-texto"></p>
        </section>

        <section id="skills" class="seccion skills">
            <h2>Skills</h2> 
            <div id="skills-container" class="skills-grid"></div>
        </section>

        <section class="seccion proyectos" id="proyectos">
            <h2>Proyectos</h2>
            <div id="proyectos-container" class="proyectos-grid"></div>
        </section>

        <section id="contacto" class="seccion contacto" >
            <h2>Contacto</h2>
            <form class="formulario-contacto">
           <div class="campo-grupo">
           
               <label for="nombreApellido">Nombre y Apellido</label>
                    <input type="text" id="nombreApellido" required>
                </div>
                <div class="campo-grupo">
                    <label for="correoElectronico">Correo Electrónico</label>
                    <input type="email" id="correoElectronico" required placeholder="email@dominio.com">
                </div>
                <div class="campo-grupo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" required placeholder="(xx) xxxx xxxx">
                </div>
                <div class="campo-grupo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-enviar">Enviar formulario</button>
            </form>
        </section>

        

    </main>


    <footer class="pie-pagina">
        <h3>Mis Redes</h3>
        <div class="redes-enlaces">
        <a id="link-github" href="#" target="_blank">
            <img src="Imagenes/github.png" alt="github">
        </a>
        <a id="link-linkedin" href="#" target="_blank">
                <img src="Imagenes/linkedin.png" alt="LinkedIn">
            </a>
        </div>
        <p class="copyright">© 2026 Andres Esteban Benitez</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="Js/data.js"></script>
    <script src="Js/scripts.js"></script>
</body>

</html>
